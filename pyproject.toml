[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "cashcrow-smartbin"
version = "0.1.0"
description = "AI-powered waste detection pipeline for Cashcrow Smartbin edge devices"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}

dependencies = [
    "ultralytics>=8.0",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[project.scripts]
smartbin = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = [
    "F821",   # undefined-name (catches missing typing imports in annotations)
    "F401",   # unused-import
    "F841",   # unused-variable
    "E711",   # comparison to None
    "E712",   # comparison to True/False
]

