# ============================================================================
# SmartBin AI v2 — Model Architecture & Taxonomy Configuration
# ============================================================================

model:
  # Base YOLO model: yolo11n, yolo11s (default), yolo11m, yolo11x, yolo11s-seg
  architecture: "yolo11s.pt"
  task: "detect" # "detect" or "segment"
  input_size: [640, 640]
  confidence_threshold: 0.45
  iou_threshold: 0.50
  max_det: 50
  device: "auto" # "auto", "cpu", "cuda:0", "mps"
  half: false # FP16 mixed precision on supported hardware
  agnostic_nms: false

# Authoritative 32-class Indian Waste Taxonomy with Category Groupings.
taxonomy:
  num_classes: 32
  categories:
    plastic:
      bin: "recyclable"
      classes:
        - "pet_bottle"
        - "hdpe_bottle"
        - "milk_packet"
        - "plastic_carry_bag"
        - "water_sachet"
        - "shampoo_bottle"
        - "chips_packet"
        - "kurkure_packet"
        - "biscuit_wrapper"
    organic:
      bin: "compost"
      classes:
        - "banana_peel"
        - "coconut_shell"
        - "egg_shell"
        - "rice_waste"
        - "vegetable_waste"
        - "fruit_waste"
        - "tea_bag"
        - "leaves"
    recyclable_other:
      bin: "recyclable"
      classes:
        - "aluminium_can"
        - "tin_can"
        - "glass_bottle"
        - "glass_jar"
        - "newspaper"
        - "cardboard"
        - "paper_cup"
        - "tetra_pak"
    landfill:
      bin: "landfill"
      classes:
        - "styrofoam"
        - "tissue"
        - "mask"
        - "cigarette_butt"
        - "sanitary_waste"
        - "ceramic"
        - "broken_plastic_toys"

# Physical sorting compartments mapping
compartment_mapping:
  recyclable: 1
  compost: 2
  landfill: 3
  reject: 4 # For contaminated or unconfident items

# Class ID to name lookup. IDs must match the dataset YAML and exported model.
class_names:
  0: "aluminium_can"
  1: "banana_peel"
  2: "biscuit_wrapper"
  3: "broken_plastic_toys"
  4: "cardboard"
